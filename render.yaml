# Blueprint Render — API TenderPro (NestJS + Prisma 7 + Neon)
#
# Déploiement : Render → New → Blueprint → connecter ce dépôt.
# Render lit ce fichier, construit le Dockerfile et demande les valeurs des
# variables marquées `sync: false` (elles ne sont JAMAIS stockées dans le repo).
#
# La base de données est déjà hébergée sur Neon : rien à provisionner ici.
services:
  - type: web
    name: tenderpro-api
    runtime: docker
    plan: free
    region: frankfurt # le plus proche de l'Afrique de l'Ouest sur l'offre gratuite
    dockerfilePath: ./Dockerfile
    branch: main
    # L'API répond sous le préfixe global /api (voir src/main.ts)
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # La base Neon est déjà provisionnée mais son historique
      # _prisma_migrations est vide (schéma poussé via `db push`).
      # `migrate deploy` rejouerait les 7 migrations depuis zéro et
      # échouerait sur les tables existantes → conteneur en crash loop.
      # À repasser à "false" une fois l'historique baseliné.
      - key: SKIP_MIGRATIONS
        value: "true"

      # --- Base de données (Neon) ---
      # DATABASE_URL      : rôle applicatif, utilisé au runtime par PrismaService
      # DATABASE_URL_ADMIN: rôle owner, utilisé par `prisma migrate deploy`
      #                     au démarrage (scripts/entrypoint.sh)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_ADMIN
        sync: false

      # --- Auth ---
      # JWT_SECRET : ≥ 64 caractères en production.
      # `generateValue` fait générer un secret aléatoire par Render.
      # ⚠ Un nouveau secret invalide toutes les sessions existantes.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: BCRYPT_ROUNDS
        value: "10"

      # --- URL publique du front (liens dans les emails d'invitation) ---
      - key: APP_URL
        sync: false

      # --- Stockage S3 ---
      # MinIO n'existe pas en prod : pointer vers un S3 hébergé
      # (Cloudflare R2 — 10 Go gratuits — ou équivalent).
      # Tant que ces variables ne sont pas renseignées, l'API démarre quand
      # même mais les upload/download de documents échouent.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: tenderpro
      - key: S3_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_DOWNLOAD_URL_EXPIRES
        value: "604800"

      # --- Redis (module J360) — Upstash a une offre gratuite ---
      - key: REDIS_URL
        sync: false

      # --- SMTP (invitations, alertes) ---
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: TenderPro

      # --- Claude (optionnel : le module se désactive si absent) ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5

      # --- Identifiants portail J360 (optionnel) ---
      - key: J360_EMAIL
        sync: false
      - key: J360_PASSWORD
        sync: false
